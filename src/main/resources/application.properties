# Settings used everywhere. application-prod.properties adds/overrides settings for production.
# (This file replaces .env + the config scattered through app.js. Any setting can also be overridden by an
#  environment variable: e.g. BASERA_SEED=never overrides basera.seed below.)

spring.application.name=basera

# Render tells us which port to use through $PORT; locally we fall back to 8080 like the Node app.
server.port=${PORT:8080}

# Create the indexes declared on our models (e.g. unique usernames/emails) when the app starts.
spring.data.mongodb.auto-index-creation=true

# --- Basera's own settings ---
# Demo data: "if-empty" (seed only an empty database), "reset" (wipe and re-seed on every start - like `npm run seed`)
# or "never".
basera.seed=if-empty

# --- Logins (config/SecurityConfig) ---
# Signs the remember-me cookie that keeps people logged in for a week, even after a restart.
# Same SESSION_SECRET environment variable as the Node app; locally an insecure development value is used.
basera.remember-me-key=${SESSION_SECRET:dev-only-secret-change-me}
# The session cookie isn't sent when another website submits a form to ours (the Node app's sameSite: "lax").
server.servlet.session.cookie.same-site=lax

# --- Forms ---
# HTML forms can only send GET and POST. A hidden field <input name="_method" value="put"> turns a POST into a
# PUT or DELETE (the Node app's method-override). Thymeleaf adds that field for th:method="put" / "delete".
spring.mvc.hiddenmethod.filter.enabled=true

# --- Listing photos (service/ImageStorage) ---
# multer's 5 MB limit. The request limit is a little higher to leave room for the other form fields.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Where photos are saved when Cloudinary isn't configured (relative to the folder the app runs in).
basera.upload-dir=${UPLOAD_DIR:uploads}
# Cloudinary - same environment variables as the Node app. Leave CLOUD_NAME empty to save photos on disk.
basera.cloudinary.cloud-name=${CLOUD_NAME:}
basera.cloudinary.api-key=${CLOUD_API_KEY:}
basera.cloudinary.api-secret=${CLOUD_API_SECRET:}

# --- Maps (service/GeocodeService) ---
# Look up map coordinates for new listings on OpenStreetMap. Tests switch this off.
basera.geocoding.enabled=true
