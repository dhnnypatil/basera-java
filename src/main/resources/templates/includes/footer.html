<!-- Footer (views/includes/footer.ejs). #dates is one of Thymeleaf's helper objects. -->
<footer th:fragment="footer" class="footer-ll">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <div>&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Basera · A college project</div>
        <div class="d-flex gap-3">
            <a th:href="@{/listings}">Explore stays</a>
            <a th:href="@{/signup(role='host')}">Host your home</a>
        </div>
        <div class="socials">
            <i class="fa-brands fa-square-facebook"></i>
            <i class="fa-brands fa-square-instagram"></i>
            <i class="fa-brands fa-square-x-twitter"></i>
        </div>
    </div>
</footer>
