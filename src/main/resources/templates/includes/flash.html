<!--
    One-time messages (views/includes/flash.ejs). `success` / `error` come from a flash redirect
    (RedirectAttributes.addFlashAttribute or web/Flash), or from a controller that re-shows a form.
    [[${success}]] prints the text HTML-escaped, like <%= success %>.
-->
<div th:fragment="flash" th:if="${success != null or error != null}" class="container mt-3">
    <div th:if="${success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>[[${success}]]
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>[[${error}]]
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
