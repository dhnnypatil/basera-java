<!DOCTYPE html>
<!--
    The frame every page shares (views/layouts/boilerplate.ejs).

    EJS (ejs-mate) vs Thymeleaf:
      a page starts with  <% layout("/layouts/boilerplate") -%>   and the layout prints it with  <%- body %>
      here a page starts with  <html th:replace="~{layouts/boilerplate :: layout(~{::content})}">
      and puts its markup in   <th:block th:fragment="content"> ... </th:block>
    th:fragment="layout(content)" below makes this whole file a fragment that takes the page's content as a
    parameter, and th:replace="${content}" prints it.

    th:replace="~{includes/navbar :: navbar}" is <%- include("../includes/navbar.ejs") %>.
    @{/css/style.css} builds a link to a file in src/main/resources/static (Express's public/ folder).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' · Basera' : 'Basera · Stays & homes'}">Basera · Stays &amp; homes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav th:replace="~{includes/navbar :: navbar}"></nav>

    <main>
        <div th:replace="~{includes/flash :: flash}"></div>
        <th:block th:replace="${content}"></th:block>
    </main>

    <footer th:replace="~{includes/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
