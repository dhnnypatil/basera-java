# Production settings - only used when the "prod" profile is active (SPRING_PROFILES_ACTIVE=prod on Render).
# A profile is Spring's version of checking NODE_ENV === "production".

# Same MONGO_URL environment variable as the Node app. There's no Docker MongoDB in production,
# so the app fails to start if this is missing.
spring.mongodb.uri=${MONGO_URL}

# Render sits in front of the app and talks to it over plain HTTP. Trust its X-Forwarded-* headers so the app
# knows the visitor actually used HTTPS (the Node app's `app.set("trust proxy", 1)`).
server.forward-headers-strategy=framework

# Only send the login cookie over HTTPS (the Node app's `cookie.secure = isProduction`).
server.servlet.session.cookie.secure=true

# Production has no development fallback: without SESSION_SECRET the app refuses to start, like the Node app.
basera.remember-me-key=${SESSION_SECRET}
